    #         proxy_set_header Host $host;
    #         proxy_set_header X-Real-IP $remote_addr;
    #         proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    #         proxy_set_header X-Forwarded-Proto $scheme;
    #     }


    #     # Additional settings for static files, etc.
    # }

    server {
      listen 443 ssl;
      # server_name pisoftsolutions.in www.pisoftsolutions.in;
      server_name 195.250.24.176 pisoftsolutions.in www.pisoftsolutions.in;

      ssl_certificate /etc/letsencrypt/live/pisoftsolutions.in/fullchain.pem;
      ssl_certificate_key /etc/letsencrypt/live/pisoftsolutions.in/privkey.pem;
      ssl_trusted_certificate /etc/letsencrypt/live/pisoftsolutions.in/chain.pem;
      # ssl_certificate /etc/nginx/ssl/fullchain.pem;
      # ssl_certificate_key /etc/nginx/ssl/privkey.pem;
      # ssl_trusted_certificate /etc/nginx/ssl/chain.pem;

      ssl_protocols TLSv1.2 TLSv1.3;
      ssl_prefer_server_ciphers on;
      ssl_ciphers "ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384";
      ssl_session_cache shared:SSL:10m;
      ssl_session_timeout 10m;

      location / {
          proxy_pass http://web:3000;
          proxy_set_header Host $host;
          proxy_set_header X-Real-IP $remote_addr;
          proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
          proxy_set_header X-Forwarded-Proto $scheme;
      }

      # location ~ ^/(assets|images|javascripts|stylesheets|packs) {
      #   root /app/public;
      #   expires max;
      #   add_header Cache-Control public;
      # }


      location ~ ^/custom_assets_path/ {
        expires max;
        add_header Cache-Control public;
        gzip_static on; # Serve pre-gzipped version if it exists
        root /app/public; # Adjust this to your app's public directory
      }


      # Add additional configurations as needed
    }

