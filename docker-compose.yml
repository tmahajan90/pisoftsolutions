# Database service removed - using external PostgreSQL database
# To use external database, set these environment variables:
# POSTGRES_HOST=localhost (or your external DB host)
# POSTGRES_PORT=5432
# POSTGRES_DB=pisoftsolutions_production
# POSTGRES_USER=your_db_user
# POSTGRES_PASSWORD=your_db_password

services:
  web:
    build: .
    command: sh -c "rm -f tmp/pids/server.pid && bundle exec rails tailwindcss:build && bundle exec rails s -p 3000 -b '0.0.0.0' -e ${RAILS_ENV:-production}"
    volumes:
      - .:/app
      - bundle_cache:/usr/local/bundle
      - node_modules_cache:/app/node_modules
    ports:
      - "3000:3000"
    environment:
      RAILS_ENV: ${RAILS_ENV:-production}
      RAILS_SERVE_STATIC_FILES: "true"
      RAILS_LOG_TO_STDOUT: "true"
      # External Database Configuration
      POSTGRES_HOST: ${POSTGRES_HOST:-localhost}
      POSTGRES_PORT: ${POSTGRES_PORT:-5432}
      POSTGRES_USER: ${POSTGRES_USER:-pisoftsolutions_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-pisoftsolutions_production}
      # Application Configuration
      SECRET_KEY_BASE: ${SECRET_KEY_BASE}
      RAZORPAY_KEY_ID: ${RAZORPAY_KEY_ID}
      RAZORPAY_KEY_SECRET: ${RAZORPAY_KEY_SECRET}
      # Cashfree Configuration
      CASHFREE_APP_ID: ${CASHFREE_APP_ID}
      CASHFREE_SECRET_KEY: ${CASHFREE_SECRET_KEY}
      CASHFREE_ENVIRONMENT: ${CASHFREE_ENVIRONMENT:-sandbox}
      CASHFREE_WEBHOOK_SECRET: ${CASHFREE_WEBHOOK_SECRET}
      DEFAULT_PAYMENT_GATEWAY: ${DEFAULT_PAYMENT_GATEWAY:-cashfree}
      FORCE_SSL: ${FORCE_SSL:-false}
      RAILS_MAX_THREADS: ${RAILS_MAX_THREADS:-5}
      WEB_CONCURRENCY: ${WEB_CONCURRENCY:-2}
      # Email Configuration
      SMTP_ADDRESS: ${SMTP_ADDRESS}
      SMTP_PORT: ${SMTP_PORT}
      SMTP_USERNAME: ${SMTP_USERNAME}
      SMTP_PASSWORD: ${SMTP_PASSWORD}
      DOMAIN: ${DOMAIN}
      ADDITIONAL_DOMAINS: ${ADDITIONAL_DOMAINS}
      SUPPORT_EMAIL: ${SUPPORT_EMAIL}
    restart: always
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: '1.0'
        reservations:
          memory: 1G
          cpus: '0.5'
      restart_policy:
        condition: on-failure
        max_attempts: 5
        delay: 10s
    stop_grace_period: 30s
    stop_signal: SIGTERM
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - my_network

  nginx:
    build:
      context: .
      dockerfile: ./nginx.Dockerfile
    volumes:
      - /etc/letsencrypt:/etc/letsencrypt  # Volume for Certbot certificates
      - ./scripts:/scripts  # Volume for scripts
      - ./public:/app/public
      - public-assets:/app/public/assets
      - ./public:/var/www/certbot  # Webroot for ACME challenges
      # - ./nginx/ssl:/etc/nginx/ssl
    depends_on:
      - web
    ports:
      - "80:80"
      - "443:443"     # HTTPS port
    environment:
      - RAILS_ENV=${RAILS_ENV:-development}
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "1"
    networks:
      - my_network

  # Certbot service for SSL certificates
  certbot:
    image: certbot/certbot
    volumes:
      - /etc/letsencrypt:/etc/letsencrypt
      - ./public:/var/www/certbot
    command: certonly --webroot --webroot-path=/var/www/certbot --email ${SUPPORT_EMAIL} --agree-tos --no-eff-email -d ${DOMAIN} -d www.${DOMAIN} -d tech.easy2invest.co.in -d www.tech.easy2invest.co.in
    depends_on:
      - nginx
    networks:
      - my_network

networks:
  my_network:
    driver: bridge

volumes:
  bundle_cache:
    driver: local
  node_modules_cache:
    driver: local
  public-assets:
    driver: local
